name: Build Status

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - LICENSE
      - README.md
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - '3.11'
          - '3.14'
        dependencies:
          - ''
          - '"pydantic<2.12"'
          - '"pandas<2" "numpy<2" "xarray<2025.09.0" "dask<2024.7.0"'
          - '"pandas<3"'
          - '"pandas<4"'
        exclude:
          # pandas<2 and pydantic<2.12 do not support Python 3.14
          - python-version: '3.14'
            dependencies: '"pydantic<2.12"'
          - python-version: '3.14'
            dependencies: '"pandas<2" "numpy<2" "xarray<2025.09.0" "dask<2024.7.0"'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions-ext/python/setup@c8228d827a81b9f8c808825328af361c45461ba3
        with:
          version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: make develop

      - name: Install dependency regression sets
        run: uv pip install -U ${{ matrix.dependencies }}
        if: matrix.dependencies != ''

      - name: Lint
        run: make lint

      - name: Checks
        run: make checks

      - name: Build
        run: make build

      - name: Test
        run: make coverage

      - name: Upload test results (Python)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: junit.xml
        if: ${{ matrix.dependencies == '' }}

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        with:
          files: '**/junit.xml'
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.dependencies == '' }}

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build distributions
        run: make dist

      - name: Test wheel
        uses: actions-ext/python/test-wheel@c8228d827a81b9f8c808825328af361c45461ba3
        with:
          module: ccflow
        if: ${{ matrix.dependencies == '' }}

      - name: Test source distribution
        uses: actions-ext/python/test-sdist@c8228d827a81b9f8c808825328af361c45461ba3
        with:
          module: ccflow
        if: ${{ matrix.dependencies == '' }}

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-${{matrix.os}}
          path: dist
        if: ${{ matrix.dependencies == '' }}
