# @package _global_

# Base configuration for the poem review example: one agent writes a poem, two argue opposing
# positions about it, and a fourth decides which argued better.
#
# Run the whole graph offline (TestModel, no credentials, checks off because generated placeholder
# text cannot satisfy a real-quotation check):
#   python -m ccflow.examples.ai checks=off
# Run it against a real model, with the mechanical constraints enforced:
#   python -m ccflow.examples.ai model=openai
# Swap one axis at a time:
#   python -m ccflow.examples.ai spec=haiku rubrics=strict profile=steelman
# Judge both presentation orders and report only what survives both:
#   python -m ccflow.examples.ai task=counterbalanced
# Write each stage to disk and chain the single-node tasks:
#   python -m ccflow.examples.ai task=produce publisher=json
#   python -m ccflow.examples.ai task=advocate publisher=json position=pro
#   python -m ccflow.examples.ai task=advocate publisher=json position=con
#   python -m ccflow.examples.ai task=arbitrate publisher=json

defaults:
  - _self_
  - model: test
  - profile: default
  - agents: poem
  - rubrics: poem
  - lessons: none
  - spec: sea
  - checks: enforced
  - publisher: none
  - task: end_to_end

callable: /task
context: {}

# Where published results are written. Each task sets its own `task_name`, so the single-node tasks
# write distinct files and chain by pointing a downstream file source at an upstream output.
run_dir: ./runs

# Re-prompts allowed when a node's output fails its contract schema or a mechanical check.
max_repair_attempts: 2

# Smallest pooled margin a counterbalanced decision must clear before a winner is reported. Agreement
# across both presentation orders is necessary but not sufficient: two arbiters agree on a coin flip
# half the time. Raise it to report fewer, firmer decisions.
decision_margin: 0.2

# Two seams exist for extending this without forking it, and they are deliberately different kinds.
#
# Countable rules are code. Any `OutputCheck` subclass can be appended to a node, where it is
# enforced alongside the built-in constraints and consumes the same repair budget:
#
#   python -m ccflow.examples.ai '+produce.extra_checks=[{_target_:my.pkg.BannedWords,words:[very]}]'
#
# Free-form direction is prose. A session takes a persona by name from the search path
# (CCFLOW_AI_AGENTS_PATH prepends directories), or directly, which is what configuration reaches for:
#
#   python -m ccflow.examples.ai '+producer_session.profile={_target_:ccflow.examples.ai.agent_profile_from_file,path:/my/house.md}'
#
# The split is the same one that keeps a line count out of the rubric: if it can be decided by
# counting, write a check, because a persona can only ask for it.

# The graph evaluator schedules the DAG; the cache evaluator is what makes the shared `produce` node
# run once rather than once per advocate. Without it the advocates would argue about different poems
# while the arbiter judged a third, and nothing would look wrong.
cli:
  model:
    _target_: ccflow.FlowOptions
    evaluator:
      _target_: ccflow.evaluators.MultiEvaluator
      evaluators:
        - _target_: ccflow.evaluators.GraphEvaluator
        - _target_: ccflow.evaluators.MemoryCacheEvaluator
    cacheable: true
