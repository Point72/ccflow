# @package _global_
#
# Write the poem and stop. Publish it and later tasks can read it back, which pins the artifact:
# model output is not reproducible, so re-running the producer would hand the advocates a different
# poem.
#
#   python -m ccflow.examples.ai task=produce publisher=json

task_name: poem

task:
  _target_: ccflow.examples.ai.ProduceModel
  publisher: ${publisher}
  enforce_checks: ${enforce_checks}
  spec: ${poem_spec}
  session: ${producer_session}
